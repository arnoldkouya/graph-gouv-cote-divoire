# Construit la carte et la déploie sur le VPS (gouvci.arnoldkouya.com) par rsync sur SSH.
#
# - À chaque push sur main : reconstruit la carte à partir des données versionnées, puis déploie.
# - Le 1er de chaque mois, ou à la demande avec « complet » : cherche les sous-domaines (crt.sh),
#   relance les vérifications HTTP, versionne les résultats, puis déploie.
#
# Secrets à créer (Settings › Secrets and variables › Actions) :
#   VPS_HOST         adresse ou nom du serveur
#   VPS_USER         utilisateur SSH (avec droit d'écriture sur VPS_PATH)
#   VPS_SSH_KEY      clé privée dédiée au déploiement
#   VPS_KNOWN_HOSTS  sortie de « ssh-keyscan -H <VPS_HOST> » (empreinte du serveur)
#   VPS_PATH         dossier servi par nginx, par exemple /var/www/gouvci
#   VPS_PORT         (facultatif) port SSH, 22 par défaut
name: Carte

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:
    inputs:
      complet:
        description: Relancer les sous-domaines et toutes les vérifications HTTP
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: carte
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test

      - name: Mise à jour complète (sous-domaines, vérifications HTTP, carte)
        if: github.event_name == 'schedule' || inputs.complet
        run: npm run update

      - name: Versionne les nouvelles données
        if: github.event_name == 'schedule' || inputs.complet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add donnees
          git diff --cached --quiet || git commit -m "Vérifications HTTP du $(date +%F)"
          git push

      - name: Construction de la carte
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.complet)
        run: npm run build

      - name: Déploiement sur le VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PATH: ${{ secrets.VPS_PATH }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -p ${VPS_PORT:-22} -o StrictHostKeyChecking=yes" \
            out/web/ "$VPS_USER@$VPS_HOST:$VPS_PATH/"
