# À placer dans /etc/nginx/sites-available/gouvci puis : ln -s … /etc/nginx/sites-enabled/
# HTTPS : sudo certbot --nginx -d gouvci.arnoldkouya.com
server {
    listen 80;
    listen [::]:80;
    server_name gouvci.arnoldkouya.com;

    root /var/www/gouvci;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/csv application/json application/xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
